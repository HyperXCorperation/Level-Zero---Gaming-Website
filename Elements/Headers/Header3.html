<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Zero - Modern Gaming</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0e0e0e;
            color: #f0f0f0;
            line-height: 1.6;
        }

        header {
            background-color: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo a {
            font-size: 2.2em;
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .logo a:hover {
            color: #e6b800;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 30px;
        }

        .nav-links li a {
            color: #ddd;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 500;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links li a:before {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: #ffcc00;
            transition: width 0.3s ease;
        }

        .nav-links li a:hover,
        .nav-links li a.active {
            color: #fff;
        }

        .nav-links li a:hover:before,
        .nav-links li a.active:before {
            width: 100%;
        }

        .hamburger {
            display: none;
            font-size: 1.8em;
            color: #ddd;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .hamburger:hover {
            color: #fff;
        }

        @media (max-width: 960px) {
            .nav-links {
                display: none;
                flex-direction: column;
                background-color: rgba(30, 30, 30, 0.95);
                position: absolute;
                top: 68px; /* Adjust based on header height */
                left: 0;
                width: 100%;
                text-align: center;
                padding: 20px 0;
                z-index: 100;
                backdrop-filter: blur(10px);
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li {
                margin: 15px 0;
            }

            .nav-links li a {
                font-size: 1.2em;
            }

            .hamburger {
                display: block;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="#">LEVEL<span style="color:#fff;">ZERO</span></a>
            </div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Games</a></li>
                <li><a href="#" class="active">Community</a></li>
                <li><a href="#">News</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </nav>
    </header>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');

            hamburger.addEventListener('click', function() {
                navLinks.classList.toggle('active');
            });
        });
    </script>

</body>
</html>
